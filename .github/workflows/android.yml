name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# LOCAL-DEVIATION: upstream builds tsnet.aar here first (set up Go, install the Android NDK, then
# `gomobile bind` against mobile/tsembed) and uploads it as a second artifact. tsnet is removed in
# this fork, so this is a plain Gradle build - which also retires the three unpinned `@latest` Go
# dependencies that build pulled in (tsnet, anet, gomobile/gobind).
jobs:
  build:

    runs-on: ubuntu-latest
    # This fork's default GITHUB_TOKEN is read-only (GitHub's default for new repositories),
    # which fails the release step with a 403. Granted explicitly here rather than via the
    # repository setting, so it stays in version control.
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Guard local deviation markers
      # Every intentional divergence from upstream carries a marker comment. A rebase that
      # silently drops one is the failure mode this guards against - see OPDRACHT.md's
      # divergence policy. Counts app/ sources only; raise EXPECTED deliberately when a new
      # divergence is added, and lower it only when one is genuinely retired.
      run: |
        EXPECTED=11
        MARKER="LOCAL-$(echo DEVIATION):"
        FOUND=$(grep -rIo "$MARKER" app | wc -l)
        echo "Found $FOUND deviation markers in app/ (expected at least $EXPECTED)"
        if [ "$FOUND" -lt "$EXPECTED" ]; then
          echo "::error::Deviation markers dropped from $EXPECTED to $FOUND - a rebase probably discarded a local change. Review before merging."
          exit 1
        fi
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Read Debug Keystore
      if: github.ref == 'refs/heads/master'
      run: |
        mkdir -p ~/.config/.android/
        echo "$ANDROID_DEBUG_KEYSTORE" | base64 -d > ~/.config/.android/debug.keystore
      env:
        ANDROID_DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
    - name: Build with Gradle
      run: ./gradlew build

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: launcher-debug-${{ github.sha }}.apk
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Delete Old Pre-Release
      if: github.ref == 'refs/heads/master'
      # No-op (not a failure) the first time this ever runs on a fork/repo, since there's no
      # existing "pre-release" tag yet to delete.
      run: gh release delete pre-release --cleanup-tag || true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Create Pre-Release
      if: github.ref == 'refs/heads/master'
      uses: ncipollo/release-action@v1
      with:
        commit: ${{ github.sha }}
        tag: "pre-release"
        name: "Debug (only for testing)"
        prerelease: true
        body: "This debug build is updated automatically whenever there is a commit to master. It is signed with a debug certificate and uses the package name `com.kidslauncher.mdm.debug`. Furthermore, the app name is set to `Kids Launcher [debug]`. **Debug builds are not suited for everyday use.**"
        generateReleaseNotes: true
        removeArtifacts: true
        replacesArtifacts: true
        artifacts: "app/build/outputs/apk/debug/app-debug.apk"
        allowUpdates: true
        token: ${{ secrets.GITHUB_TOKEN }}
